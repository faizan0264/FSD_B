<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        let c=a+b;
        alert("value is  " + c);
        c=a*b;
        alert("value is  " + c);
        c=a-b;
        alert("value is  " + c);
        c=a/b;
        alert("value is  " + c);
        if(a<b){
            document.write(b);
        }
        else{
            document.write(a);
        }
    </script>
</body>
</html>
